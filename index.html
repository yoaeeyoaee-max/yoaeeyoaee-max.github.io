<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>ZenHub — Exclusive Marketplace</title>
<script src="https://www.paypal.com/sdk/js?client-id=BAAYyKEybHpIXol-V-A4la2YPvkmPZtC9puaWCLqOPOxsdq80CX1VjaURALzj3gTjmVottYyiPVgbeBP6A&currency=EUR&components=buttons&disable-funding=card"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #d4af37;
    --gold-light: #f4e5a1;
    --dark: #0a0a0a;
    --dark-2: #141414;
    --dark-3: #1c1c1c;
    --text: #e8e8e8;
    --muted: #888;
  }
  body { font-family: 'Georgia','Times New Roman',serif; background: var(--dark); color: var(--text); min-height: 100vh; line-height: 1.6; }
  h1, h2, h3 { font-weight: 300; letter-spacing: 2px; }

  header { background: linear-gradient(180deg,#000,var(--dark-2)); border-bottom: 1px solid var(--gold); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px; }
  .logo { font-size: 28px; letter-spacing: 8px; color: var(--gold); cursor: pointer; }
  .logo span { color: var(--gold-light); }
  nav { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  nav button { background: none; border: none; color: var(--text); font-family: inherit; font-size: 13px; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; padding: 8px 0; transition: color 0.3s; }
  nav button:hover { color: var(--gold); }
  .cart-btn { position: relative; }
  .cart-count { position: absolute; top: -5px; right: -12px; background: var(--gold); color: #000; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }

  .hero { text-align: center; padding: 100px 20px 60px; background: radial-gradient(ellipse at center,#1a1a1a 0%,var(--dark) 70%); }
  .hero h1 { font-size: 64px; color: var(--gold); letter-spacing: 15px; margin-bottom: 20px; animation: fadeIn 1.5s ease; }
  .hero p { color: var(--muted); font-style: italic; letter-spacing: 3px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: translateY(0);} }

  .container { max-width: 1400px; margin: 0 auto; padding: 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(300px,1fr)); gap: 30px; }
  .item-card { background: var(--dark-2); border: 1px solid #222; overflow: hidden; cursor: pointer; transition: all 0.4s; }
  .item-card:hover { border-color: var(--gold); transform: translateY(-5px); box-shadow: 0 20px 40px rgba(212,175,55,0.15); }
  .item-card img, .item-card video { width: 100%; height: 320px; object-fit: cover; display: block; }
  .item-info { padding: 20px; }
  .item-info h3 { font-size: 18px; margin-bottom: 8px; color: var(--gold-light); }
  .item-info .price { color: var(--gold); font-size: 20px; font-weight: bold; }
  .item-info .stock { color: var(--muted); font-size: 12px; margin-top: 5px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; overflow-y: auto; padding: 40px 20px; }
  .modal-overlay.active { display: block; }
  .modal { max-width: 900px; margin: 0 auto; background: var(--dark-2); border: 1px solid var(--gold); padding: 40px; position: relative; }
  .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: var(--gold); font-size: 30px; cursor: pointer; line-height: 1; }
  .media-main { width: 100%; height: 450px; object-fit: cover; border: 1px solid #333; background: #000; }
  .media-thumbs { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .media-thumbs img, .media-thumbs video { width: 80px; height: 80px; object-fit: cover; cursor: pointer; border: 1px solid #333; }
  .media-thumbs img:hover, .media-thumbs video:hover { border-color: var(--gold); }

  .item-title { font-size: 32px; color: var(--gold); margin: 20px 0 15px; letter-spacing: 3px; }
  .item-price { font-size: 28px; color: var(--gold-light); margin-bottom: 20px; }
  .item-desc { color: #bbb; margin-bottom: 20px; line-height: 1.8; }

  .btn { padding: 15px 35px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font-family: inherit; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; margin-right: 10px; margin-top: 10px; }
  .btn:hover { background: var(--gold); color: #000; }
  .btn-primary { background: var(--gold); color: #000; }
  .btn-primary:hover { background: var(--gold-light); }
  .btn-block { display: block; width: 100%; margin: 10px 0; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  input, textarea, select { width: 100%; padding: 14px 16px; margin-bottom: 15px; background: var(--dark-3); border: 1px solid #333; color: var(--text); font-family: inherit; font-size: 14px; }
  input:focus, textarea:focus { outline: none; border-color: var(--gold); }
  label { display: block; margin-bottom: 6px; color: var(--gold-light); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

  .admin-panel { padding: 40px; max-width: 1200px; margin: 0 auto; }
  .admin-panel h2 { color: var(--gold); margin-bottom: 30px; letter-spacing: 5px; }
  .admin-tabs { display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid #333; flex-wrap: wrap; }
  .admin-tab { background: none; border: none; color: var(--muted); padding: 12px 20px; cursor: pointer; font-family: inherit; letter-spacing: 2px; text-transform: uppercase; font-size: 12px; border-bottom: 2px solid transparent; }
  .admin-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .admin-section { display: none; }
  .admin-section.active { display: block; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 20px; margin-bottom: 40px; }
  .stat-card { background: var(--dark-2); border: 1px solid #333; padding: 25px; text-align: center; }
  .stat-card .num { font-size: 36px; color: var(--gold); }
  .stat-card .lbl { color: var(--muted); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; }

  .order-row, .item-row { background: var(--dark-2); border: 1px solid #333; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
  .order-row .info, .item-row .info { flex: 1; min-width: 200px; }
  .order-row small, .item-row small { color: var(--muted); }

  .upload-zone { border: 2px dashed #444; padding: 25px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 15px; transition: all 0.3s; }
  .upload-zone:hover { border-color: var(--gold); color: var(--gold); }
  .preview-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
  .preview-item { position: relative; width: 100px; height: 100px; border: 1px solid #333; }
  .preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
  .preview-item .remove { position: absolute; top: -8px; right: -8px; background: #c00; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 14px; line-height: 1; }

  .toast { position: fixed; bottom: 30px; right: 30px; background: var(--gold); color: #000; padding: 15px 25px; letter-spacing: 1px; z-index: 2000; opacity: 0; transform: translateY(20px); transition: all 0.4s; pointer-events: none; font-size: 13px; max-width: 90%; }
  .toast.show { opacity: 1; transform: translateY(0); }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-style: italic; }
  .hidden { display: none !important; }
  .loading { text-align: center; padding: 80px 20px; color: var(--gold); letter-spacing: 4px; }

  .payment-box { background: var(--dark-2); border: 1px solid var(--gold); padding: 40px; margin-bottom: 25px; text-align: center; }
  .disabled-method { background: var(--dark-3); border: 1px solid #333; padding: 16px; margin-top: 15px; text-align: center; opacity: 0.5; cursor: not-allowed; }
  .disabled-method .label { color: var(--muted); font-size: 14px; letter-spacing: 2px; font-family: sans-serif; }
  .disabled-method .note { color: #c00; font-size: 12px; margin-top: 5px; font-family: sans-serif; }

  @media (max-width: 700px) {
    header { padding: 15px 20px; }
    .logo { font-size: 20px; letter-spacing: 4px; }
    nav { gap: 12px; }
    nav button { font-size: 11px; }
    .hero h1 { font-size: 36px; letter-spacing: 8px; }
    .container, .admin-panel { padding: 20px; }
    .modal { padding: 25px; }
    .media-main { height: 250px; }
  }
</style>
</head>

<header>
  <div class="logo" onclick="showPage('home')">ZenHub<span>.</span></div>
  <nav>
    <button onclick="showPage('home')">Collection</button>
    <button class="cart-btn" onclick="showPage('cart')">Cart <span class="cart-count" id="cartCount">0</span></button>
    <button id="authBtn" onclick="showPage('login')">Sign In</button>
    <button id="adminBtn" class="hidden" onclick="showPage('admin')">Admin</button>
    <button id="logoutBtn" class="hidden" onclick="logout()">Sign Out</button>
  </nav>
</header>

<main id="app"><div class="loading">LOADING...</div></main>
<div class="toast" id="toast"></div>

<script type="module">
/* ============================================================
   FIREBASE IMPORTS
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, doc, updateDoc,
  deleteDoc, serverTimestamp, setDoc, onSnapshot, increment
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ============================================================
   CONFIGURATION
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyApbWHOrPtFR89OBOy6oupDe50b-KnAPRM",
  authDomain: "website-add1d.firebaseapp.com",
  projectId: "website-add1d",
  storageBucket: "website-add1d.firebasestorage.app",
  messagingSenderId: "1089528736196",
  appId: "1:1089528736196:web:619e1959627cb9c9199c91",
  measurementId: "G-6E5J5V3R7H"
};

const CLOUDINARY_CLOUD_NAME = "euhvgvmp";           // ✅ JAVÍTVA
const CLOUDINARY_PRESET     = "luxe_unsigned";
const ADMIN_EMAIL           = "yoaeeyoaee@gmail.com";

/* ============================================================
   INIT
   ============================================================ */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let isAdmin = false;
let items = [];
let cart = JSON.parse(localStorage.getItem('zenhub_cart') || '[]');
let currentItem = null;
let draftMedia = [];

/* ⬇️⬇️⬇️ ÚJ: CHECKOUT USER MENTÉS ⬇️⬇️⬇️ */
let checkoutUserUid = null;
let checkoutUserEmail = null;

/* ============================================================
   UI HELPERS
   ============================================================ */
window.toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
};

const $ = (id) => document.getElementById(id);

function formatPrice(p) {
  return new Intl.NumberFormat('en-US').format(p) + ' €';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateCartCount() {
  const c = cart.reduce((s, x) => s + x.qty, 0);
  $('cartCount').textContent = c;
}

function saveCart() {
  localStorage.setItem('zenhub_cart', JSON.stringify(cart));
  updateCartCount();
}

function updateNav() {
  if (currentUser) {
    $('authBtn').classList.add('hidden');
    $('logoutBtn').classList.remove('hidden');
    $('adminBtn').classList.toggle('hidden', !isAdmin);
  } else {
    $('authBtn').classList.remove('hidden');
    $('adminBtn').classList.add('hidden');
    $('logoutBtn').classList.add('hidden');
  }
}

/* ============================================================
   CLOUDINARY UPLOAD
   ============================================================ */
async function uploadToCloudinary(file) {
  const isVideo = file.type.startsWith('video');
  const resourceType = isVideo ? 'video' : 'image';

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  formData.append('folder', 'zenhub-items');

  const res = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`,
    { method: 'POST', body: formData }
  );

  if (!res.ok) {
    const err = await res.text();
    console.error('Cloudinary error:', err);
    throw new Error('Upload failed');
  }

  const data = await res.json();
  return { url: data.secure_url, type: isVideo ? 'video' : 'image' };
}

/* ============================================================
   ITEMS REALTIME SUBSCRIPTION
   ============================================================ */
function subscribeItems(callback) {
  return onSnapshot(collection(db, 'items'), (snap) => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    if (callback) callback();
  }, (err) => {
    console.error('Items load error:', err);
    toast('Error loading products');
  });
}

/* ============================================================
   ROUTING
   ============================================================ */
window.showPage = (page) => {
  window.scrollTo(0, 0);
  switch (page) {
    case 'home':     renderHome(); break;
    case 'cart':     renderCart(); break;
    case 'login':    renderLogin(); break;
    case 'signup':   renderSignup(); break;
    case 'admin':    isAdmin ? renderAdmin() : renderLogin(); break;
    case 'checkout': currentUser ? renderCheckout() : renderLogin(); break;
  }
  updateNav();
  updateCartCount();
};

/* ============================================================
   HOME
   ============================================================ */
function renderHome() {
  const app = $('app');
  let html = `
    <section class="hero">
      <h1>ZenHub</h1>
      <p>— The Refined Choice —</p>
    </section>
    <div class="container">`;

  if (items.length === 0) {
    html += `<div class="empty">No products available at the moment.</div>`;
  } else {
    html += `<div class="grid">`;
    items.forEach(it => {
      const cover = it.media && it.media[0]
        ? (it.media[0].type === 'video'
            ? `<video src="${it.media[0].url}" muted></video>`
            : `<img src="${it.media[0].url}" alt="">`)
        : `<div style="height:320px;background:#111;display:flex;align-items:center;justify-content:center;color:#444;">No image</div>`;
      html += `
        <div class="item-card" onclick="openItem('${it.id}')">
          ${cover}
          <div class="item-info">
            <h3>${escapeHtml(it.name)}</h3>
            <div class="price">${formatPrice(it.price)}</div>
            <div class="stock">${it.stock > 0 ? 'Available: ' + it.stock + ' pcs' : 'Sold out'}</div>
          </div>
        </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  app.innerHTML = html;
}

/* ============================================================
   ITEM MODAL
   ============================================================ */
window.openItem = (id) => {
  const it = items.find(x => x.id === id);
  if (!it) return;
  currentItem = it;
  const media = it.media || [];
  const main = media[0];
  const html = `
    <div class="modal-overlay active" id="itemModal" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <button class="close-btn" onclick="closeModal()">×</button>
        <div id="mainMedia">${renderMedia(main, true)}</div>
        ${media.length > 1 ? `<div class="media-thumbs">${media.map((m,i) =>
          `<div onclick="switchMedia(${i})">${renderMedia(m,false)}</div>`).join('')}</div>` : ''}
        <h2 class="item-title">${escapeHtml(it.name)}</h2>
        <div class="item-price">${formatPrice(it.price)}</div>
        <p class="item-desc">${escapeHtml(it.description || '')}</p>
        <p style="color:var(--muted);font-size:13px;">In stock: ${it.stock} pcs</p>
        <div style="margin-top:25px;">
          <button class="btn" onclick="addToCart('${it.id}')">Add to Cart</button>
          <button class="btn btn-primary" onclick="buyNow('${it.id}')">Pay</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
};

function renderMedia(m, big) {
  if (!m) return `<div class="media-main" style="display:flex;align-items:center;justify-content:center;color:#444;">No media</div>`;
  if (m.type === 'video')
    return `<video class="${big ? 'media-main' : ''}" src="${m.url}" controls ${big ? '' : 'muted'}></video>`;
  return `<img class="${big ? 'media-main' : ''}" src="${m.url}" alt="">`;
}

window.switchMedia = (i) => {
  if (!currentItem) return;
  $('mainMedia').innerHTML = renderMedia(currentItem.media[i], true);
};

window.closeModal = () => {
  const m = $('itemModal');
  if (m) m.remove();
};

/* ============================================================
   CART
   ============================================================ */
window.addToCart = (id, qty = 1) => {
  const it = items.find(x => x.id === id);
  if (!it) return;
  if (it.stock < 1) { toast('Sold out'); return; }
  const ex = cart.find(c => c.id === id);
  if (ex) ex.qty += qty;
  else cart.push({ id, qty });
  saveCart();
  toast('Added to cart');
  closeModal();
};

window.buyNow = (id) => {
  addToCart(id);
  if (!currentUser) { toast('Please sign in to pay'); showPage('login'); return; }
  showPage('checkout');
};

function renderCart() {
  const app = $('app');
  if (cart.length === 0) {
    app.innerHTML = `<div class="container"><h2 style="color:var(--gold);margin:40px 0;letter-spacing:5px;">CART</h2><div class="empty">Your cart is empty.</div></div>`;
    return;
  }
  let total = 0, html = `<div class="container"><h2 style="color:var(--gold);margin:40px 0;letter-spacing:5px;">CART</h2>`;
  cart.forEach(c => {
    const it = items.find(x => x.id === c.id);
    if (!it) return;
    const sub = it.price * c.qty;
    total += sub;
    html += `
      <div class="order-row">
        <div class="info">
          <strong style="color:var(--gold-light);">${escapeHtml(it.name)}</strong><br>
          <small>${formatPrice(it.price)} × ${c.qty} = ${formatPrice(sub)}</small>
        </div>
        <button class="btn" onclick="removeFromCart('${it.id}')">Remove</button>
      </div>`;
  });
  html += `
    <div style="text-align:right;margin-top:30px;font-size:24px;color:var(--gold);">Total: ${formatPrice(total)}</div>
    <div style="text-align:right;margin-top:20px;">
      <button class="btn btn-primary" onclick="goCheckout()">Proceed to Checkout</button>
    </div>
  </div>`;
  app.innerHTML = html;
}

window.removeFromCart = (id) => {
  cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCart();
};

window.goCheckout = () => {
  if (!currentUser) { toast('Please sign in'); showPage('login'); return; }
  showPage('checkout');
};

/* ============================================================
   LOGIN / SIGNUP
   ============================================================ */
function renderLogin() {
  $('app').innerHTML = `
    <div class="container" style="max-width:450px;margin-top:60px;">
      <h2 style="color:var(--gold);text-align:center;letter-spacing:5px;margin-bottom:30px;">SIGN IN</h2>
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••">
      <button class="btn btn-primary btn-block" onclick="doLogin()">Sign In</button>
      <p style="text-align:center;margin-top:20px;color:var(--muted);font-size:13px;">
        No account? <a href="#" style="color:var(--gold);" onclick="showPage('signup');return false;">Sign Up</a>
      </p>
    </div>`;
}

function renderSignup() {
  $('app').innerHTML = `
    <div class="container" style="max-width:450px;margin-top:60px;">
      <h2 style="color:var(--gold);text-align:center;letter-spacing:5px;margin-bottom:30px;">SIGN UP</h2>
      <label>Email</label>
      <input type="email" id="signEmail" placeholder="you@example.com">
      <label>Password (min. 6 characters)</label>
      <input type="password" id="signPass" placeholder="••••••">
      <label>Confirm Password</label>
      <input type="password" id="signPass2" placeholder="••••••">
      <button class="btn btn-primary btn-block" onclick="doSignup()">Create Account</button>
      <p style="text-align:center;margin-top:20px;color:var(--muted);font-size:13px;">
        Already have an account? <a href="#" style="color:var(--gold);" onclick="showPage('login');return false;">Sign In</a>
      </p>
    </div>`;
}

function validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

window.doLogin = async () => {
  const email = $('loginEmail').value.trim();
  const pass = $('loginPass').value;
  if (!email || !pass) { toast('Please fill in all fields'); return; }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    toast('Signed in successfully');
    showPage('home');
  } catch (e) {
    console.error(e);
    if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password') toast('Invalid email or password');
    else if (e.code === 'auth/user-not-found') toast('No account with this email');
    else toast('Error: ' + e.code);
  }
};

window.doSignup = async () => {
  const email = $('signEmail').value.trim();
  const p1 = $('signPass').value;
  const p2 = $('signPass2').value;
  if (!validEmail(email)) { toast('Invalid email address'); return; }
  if (p1.length < 6) { toast('Password must be at least 6 characters'); return; }
  if (p1 !== p2) { toast('Passwords do not match'); return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, p1);
    await setDoc(doc(db, 'users', cred.user.uid), {
      email, createdAt: serverTimestamp()
    });
    toast('Account created');
    showPage('home');
  } catch (e) {
    console.error(e);
    if (e.code === 'auth/email-already-in-use') toast('This email is already registered');
    else if (e.code === 'auth/weak-password') toast('Password too weak');
    else toast('Error: ' + e.code);
  }
};

window.logout = async () => {
  await signOut(auth);
  toast('Signed out');
  showPage('home');
};

/* ============================================================
   ADMIN PANEL
   ============================================================ */
function renderAdmin() {
  $('app').innerHTML = `
    <div class="admin-panel">
      <h2>ADMIN PANEL</h2>
      <div class="admin-tabs">
        <button class="admin-tab active" onclick="switchTab('stats',this)">Overview</button>
        <button class="admin-tab" onclick="switchTab('items',this)">Products</button>
        <button class="admin-tab" onclick="switchTab('add',this)">New Product</button>
        <button class="admin-tab" onclick="switchTab('orders',this)">Orders</button>
      </div>
      <div id="tab-stats" class="admin-section active"></div>
      <div id="tab-items" class="admin-section"></div>
      <div id="tab-add" class="admin-section"></div>
      <div id="tab-orders" class="admin-section"></div>
    </div>`;
  renderStatsTab();
  renderItemsTab();
  renderAddTab();
  renderOrdersTab();
}

window.switchTab = (name, btn) => {
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  $('tab-' + name).classList.add('active');
};

async function renderStatsTab() {
  const snap = await getDocs(collection(db, 'orders'));
  const orders = snap.docs.map(d => d.data());
  const totalRevenue = orders.reduce((s, o) => s + (o.total || 0), 0);
  const totalStock = items.reduce((s, i) => s + (i.stock || 0), 0);
  $('tab-stats').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${orders.length}</div><div class="lbl">Orders</div></div>
      <div class="stat-card"><div class="num">${formatPrice(totalRevenue)}</div><div class="lbl">Revenue</div></div>
      <div class="stat-card"><div class="num">${items.length}</div><div class="lbl">Products</div></div>
      <div class="stat-card"><div class="num">${totalStock}</div><div class="lbl">Total Stock</div></div>
    </div>`;
}

function renderItemsTab() {
  if (items.length === 0) {
    $('tab-items').innerHTML = `<div class="empty">No products.</div>`;
    return;
  }
  let html = '';
  items.forEach(it => {
    html += `
      <div class="item-row">
        <div class="info">
          <strong style="color:var(--gold-light);">${escapeHtml(it.name)}</strong><br>
          <small>${formatPrice(it.price)} • Stock: ${it.stock} pcs • ${(it.links||[]).length} links</small>
        </div>
        <button class="btn" onclick="deleteItem('${it.id}')">Delete</button>
      </div>`;
  });
  $('tab-items').innerHTML = html;
}

window.deleteItem = async (id) => {
  if (!confirm('Delete this product?')) return;
  try {
    await deleteDoc(doc(db, 'items', id));
    toast('Deleted');
  } catch (e) {
    console.error(e);
    toast('Delete failed');
  }
};

function renderAddTab() {
  draftMedia = [];
  $('tab-add').innerHTML = `
    <h3 style="color:var(--gold);margin-bottom:20px;letter-spacing:3px;">NEW PRODUCT</h3>
    <label>Product Name</label>
    <input type="text" id="newName" placeholder="e.g. Luxury Watch">
    <label>Price (€)</label>
    <input type="number" id="newPrice" placeholder="5000" min="0">
    <label>Stock (pcs)</label>
    <input type="number" id="newStock" placeholder="10" min="0">
    <label>Description</label>
    <textarea id="newDesc" rows="4" placeholder="Product description..."></textarea>

    <label>Media (image / video)</label>
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      Click here to upload image or video
    </div>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple class="hidden" onchange="handleFiles(event)">
    <div class="preview-grid" id="previewGrid"></div>

    <button class="btn btn-primary btn-block" onclick="publishItemStep1()">Next</button>
  `;
}

window.handleFiles = async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  const zone = document.querySelector('.upload-zone');
  const oldText = zone.textContent;
  zone.textContent = 'Uploading...';

  for (const file of files) {
    try {
      const result = await uploadToCloudinary(file);
      draftMedia.push({ ...result, name: file.name });
    } catch (err) {
      console.error(err);
      toast('Upload failed: ' + file.name);
    }
  }
  zone.textContent = oldText;
  renderPreview();
  e.target.value = '';
};

function renderPreview() {
  const grid = $('previewGrid');
  if (!grid) return;
  grid.innerHTML = draftMedia.map((m, i) => `
    <div class="preview-item">
      ${m.type === 'video'
        ? `<video src="${m.url}" muted></video>`
        : `<img src="${m.url}">`}
      <button class="remove" onclick="removeDraftMedia(${i})">×</button>
    </div>
  `).join('');
}

window.removeDraftMedia = (i) => {
  draftMedia.splice(i, 1);
  renderPreview();
};

window.publishItemStep1 = () => {
  const name = $('newName').value.trim();
  const price = parseFloat($('newPrice').value);
  const stock = parseInt($('newStock').value);
  const desc = $('newDesc').value.trim();

  if (!name) { toast('Enter a name'); return; }
  if (isNaN(price) || price < 0) { toast('Enter a valid price'); return; }
  if (isNaN(stock) || stock < 0) { toast('Enter a valid stock'); return; }

  $('tab-add').innerHTML = `
    <h3 style="color:var(--gold);margin-bottom:20px;letter-spacing:3px;">ADD LINKS</h3>
    <p style="color:var(--muted);margin-bottom:20px;">
      Enter the links the buyer will receive. One is chosen randomly per purchase.
      One link per line.
    </p>
    <label>Links (one per line)</label>
    <textarea id="newLinks" rows="6" placeholder="https://example.com/item1&#10;https://example.com/item2"></textarea>
    <button class="btn" onclick="renderAddTab()">Back</button>
    <button class="btn btn-primary" onclick="publishItemStep2('${escapeHtml(name).replace(/'/g,"\\'")}', ${price}, ${stock}, '${escapeHtml(desc).replace(/'/g,"\\'")}')">Publish Item</button>
  `;
};

window.publishItemStep2 = async (name, price, stock, desc) => {
  const linksText = $('newLinks').value;
  const links = linksText.split('\n').map(l => l.trim()).filter(l => l);

  if (links.length === 0) { toast('Add at least one link'); return; }

  try {
    await addDoc(collection(db, 'items'), {
      name, price, stock, description: desc,
      media: draftMedia,
      links,
      createdAt: serverTimestamp()
    });
    toast('Product published!');
    draftMedia = [];
    renderAdmin();
  } catch (e) {
    console.error(e);
    toast('Save failed: ' + e.message);
  }
};

async function renderOrdersTab() {
  const snap = await getDocs(collection(db, 'orders'));
  const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  orders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

  if (orders.length === 0) {
    $('tab-orders').innerHTML = `<div class="empty">No orders.</div>`;
    return;
  }

  let html = '';
  orders.forEach(o => {
    const date = o.createdAt?.seconds
      ? new Date(o.createdAt.seconds * 1000).toLocaleString('en-US')
      : '—';
    html += `
      <div class="order-row" style="flex-direction:column;align-items:flex-start;">
        <div style="width:100%;">
          <strong style="color:var(--gold-light);">${o.email || '—'}</strong>
          <small style="float:right;">${date}</small><br>
          <small>Amount: ${formatPrice(o.total || 0)}</small><br>
          <div style="margin-top:10px;">
            ${(o.lines||[]).map(l => `
              <div style="background:var(--dark-3);padding:10px;margin-bottom:8px;border-left:3px solid var(--gold);">
                <strong>${escapeHtml(l.name)}</strong> × ${l.qty}<br>
                ${(l.links||[]).map(lk => `<div style="font-family:monospace;font-size:12px;color:#9fd;word-break:break-all;">${escapeHtml(lk)}</div>`).join('')}
              </div>
            `).join('')}
          </div>
        </div>
      </div>`;
  });
  $('tab-orders').innerHTML = html;
}

/* ============================================================
   CHECKOUT
   ============================================================ */
function renderCheckout() {
  if (!currentUser) { renderLogin(); return; }
  if (cart.length === 0) { renderCart(); return; }

  /* ⬇️⬇️⬇️ ÚJ: ELMENTJÜK A USER ADATAIT MODUL SZINTŰ VÁLTOZÓKBA ⬇️⬇️⬇️ */
  checkoutUserUid   = currentUser.uid;
  checkoutUserEmail = (currentUser.email || '').toLowerCase().trim();

  console.log("Checkout user mentve:", checkoutUserUid, checkoutUserEmail);

  let total = 0, rows = '';
  cart.forEach(c => {
    const it = items.find(x => x.id === c.id);
    if (!it) return;
    const sub = it.price * c.qty;
    total += sub;
    rows += `<div class="order-row"><div class="info"><strong style="color:var(--gold-light);">${escapeHtml(it.name)}</strong> × ${c.qty}</div><div>${formatPrice(sub)}</div></div>`;
  });

  $('app').innerHTML = `
    <div class="container" style="max-width:700px;margin-top:40px;">
      <h2 style="color:var(--gold);letter-spacing:5px;margin-bottom:30px;">CHECKOUT</h2>
      ${rows}
      <div style="text-align:right;font-size:26px;color:var(--gold);margin:25px 0;">Total: ${formatPrice(total)}</div>

      <div class="payment-box">
        <h3 style="color:var(--gold-light);margin-bottom:25px;font-size:16px;letter-spacing:3px;">PAY WITH PAYPAL</h3>
        <div id="paypal-button-container"></div>

        <div class="disabled-method">
          <div class="label">💳 Debit or Credit Card</div>
          <div class="note">(Not available)</div>
        </div>

        <p style="color:var(--muted);font-size:12px;margin-top:20px;">Secure payment powered by PayPal</p>
      </div>
    </div>`;

  if (window.paypal) {
    $('paypal-button-container').innerHTML = '';

    paypal.Buttons({
      style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'paypal' },
      createOrder: (data, actions) => {
        return actions.order.create({
          purchase_units: [{ amount: { value: total.toFixed(2), currency_code: 'EUR' } }]
        });
      },
      onApprove: async (data, actions) => {
        const details = await actions.order.capture();
        /* ⬇️ A MENTETT VÁLTOZÓKAT HASZNÁLJUK, NEM A currentUser-t ⬇️ */
        await finalizeOrder(total, details.id, checkoutUserUid, checkoutUserEmail);
      },
      onError: (err) => { console.error('PayPal error:', err); toast('PayPal error'); },
      onCancel: () => { toast('Payment cancelled'); }
    }).render('#paypal-button-container');
  } else {
    $('paypal-button-container').innerHTML = `<p style="color:#c00;">PayPal SDK failed to load. Please refresh the page.</p>`;
  }
}

/* ============================================================
   FINALIZE ORDER
   ============================================================ */
async function finalizeOrder(total, paypalOrderId, userUid, userEmail) {
  try {
    console.log("=== FINALIZE ORDER ===");
    console.log("userUid:", userUid);
    console.log("userEmail:", userEmail);
    console.log("auth.currentUser?.uid:", auth.currentUser?.uid);

    if (!userUid) { toast('You must be signed in'); return; }

    const lines = [];
    const updates = [];

    for (const c of cart) {
      const it = items.find(x => x.id === c.id);
      if (!it) continue;
      if (it.stock < c.qty) { toast(`Not enough stock: ${it.name}`); return; }

      const links = it.links && it.links.length ? it.links : ['(no link)'];
      const delivered = [];
      for (let i = 0; i < c.qty; i++) {
        delivered.push(links[Math.floor(Math.random() * links.length)]);
      }
      lines.push({ itemId: it.id, name: it.name, price: it.price, qty: c.qty, links: delivered });
      updates.push({ id: it.id, qty: c.qty });
    }

    const orderRef = await addDoc(collection(db, 'orders'), {
      userId: userUid,
      email: userEmail,
      total,
      paypalOrderId,
      lines,
      createdAt: serverTimestamp()
    });

    console.log("ORDER MENTVE:", orderRef.id);

    for (const u of updates) {
      await updateDoc(doc(db, 'items', u.id), { stock: increment(-u.qty) });
    }

    cart = [];
    saveCart();
    checkoutUserUid = null;
    checkoutUserEmail = null;
    renderOrderSuccess({ id: orderRef.id, lines });
  } catch (e) {
    console.error('Order save error:', e);
    console.error('Error code:', e.code);
    toast('Order save failed: ' + (e.message || e.code || 'unknown'));
  }
}

function renderOrderSuccess(order) {
  let linksHtml = '';
  order.lines.forEach(l => {
    linksHtml += `<div style="background:var(--dark-3);padding:15px;margin-bottom:12px;border-left:3px solid var(--gold);">
      <strong style="color:var(--gold-light);">${escapeHtml(l.name)}</strong> × ${l.qty}<br>
      ${l.links.map(lk => `<div style="font-family:monospace;font-size:13px;color:#9fd;margin-top:6px;word-break:break-all;">${escapeHtml(lk)}</div>`).join('')}
    </div>`;
  });

  $('app').innerHTML = `
    <div class="container" style="max-width:700px;margin-top:60px;text-align:center;">
      <h2 style="color:var(--gold);letter-spacing:5px;margin-bottom:20px;">THANK YOU FOR YOUR PURCHASE</h2>
      <p style="color:var(--muted);margin-bottom:30px;">Order ID: <strong style="color:var(--gold-light);">${order.id}</strong></p>
      <div style="text-align:left;margin-top:40px;">
        <h3 style="color:var(--gold);letter-spacing:3px;margin-bottom:20px;">YOUR LINKS</h3>
        ${linksHtml}
      </div>
      <button class="btn btn-primary" style="margin-top:30px;" onclick="showPage('home')">Back to Home</button>
    </div>`;
}

  isAdmin = !!(u && u.email && u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());

showPage('home');
updateCartCount();
